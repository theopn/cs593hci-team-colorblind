<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Configurable color-mole interaction prototype for HCI testing.">
  <title>Color Mole — HCI Prototype</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2028'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='15' fill='%235ca8ff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --floor: rgb(196, 180, 145);
      --hole: rgb(66, 210, 34);
      --mole: rgb(188, 56, 42);
      --ink: #f4f7fb;
      --muted: #9da8b7;
      --panel: #1d222b;
      --panel-2: #252c37;
      --accent: #5ca8ff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: #11151b;
      color: var(--ink);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button, input { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(620px, 1fr) 370px;
    }

    .app.panel-hidden { grid-template-columns: 1fr; }

    .game-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--floor);
      color: #15191e;
      padding: 32px clamp(28px, 5vw, 76px) 26px;
    }

    .game-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    .instruction {
      margin: 10px 0 0;
      font-size: 1rem;
      opacity: .82;
    }

    .participant-toggle {
      min-width: 154px;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      color: #f6f8fb;
      background: rgba(18, 23, 30, .84);
      cursor: pointer;
    }

    .board {
      width: min(100%, 720px);
      margin: 28px auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 1fr));
      align-content: center;
      gap: clamp(58px, 9vh, 96px) clamp(55px, 7vw, 100px);
    }

    .hole {
      width: 100%;
      aspect-ratio: 1.6 / 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--hole);
      box-shadow: none;
      appearance: none;
      cursor: pointer;
      transition: none;
      -webkit-tap-highlight-color: transparent;
    }

    .hole.active { background: var(--mole); }

    .hole:hover, .hole:active { filter: none; transform: none; }

    .hole:focus { outline: none; }

    .hole:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .8);
      outline-offset: 6px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 28px;
      min-height: 34px;
      font-variant-numeric: tabular-nums;
    }

    .status-message {
      margin-left: auto;
      font-weight: 700;
    }

    .panel {
      min-height: 100vh;
      padding: 28px 26px 24px;
      background: var(--panel);
      border-left: 1px solid #343d4a;
      overflow-y: auto;
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
    }

    .panel h2 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: .02em;
    }

    .panel-note { margin: 3px 0 0; color: var(--muted); font-size: .875rem; }

    .close-panel {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--ink);
      cursor: pointer;
    }

    fieldset {
      margin: 0 0 24px;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 14px;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .control { margin-bottom: 15px; }

    .control-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 7px;
      color: #dfe5ed;
      font-size: .875rem;
    }

    output { color: #fff; font-variant-numeric: tabular-nums; }

    input[type="range"] {
      width: 100%;
      height: 22px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .color-group {
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px 12px;
      align-items: start;
    }

    .color-controls { min-width: 0; }

    .swatch {
      width: 42px;
      height: 42px;
      margin-top: 1px;
      border-radius: 7px;
      background: var(--swatch);
      border: 1px solid rgba(255, 255, 255, .16);
    }

    .channel {
      display: grid;
      grid-template-columns: 18px 1fr 32px;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      font-size: .8rem;
      color: var(--muted);
    }

    .channel input { height: 18px; }
    .channel output { text-align: right; font-size: .8rem; }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 2px;
    }

    .action {
      border: 1px solid #465263;
      border-radius: 8px;
      padding: 10px 8px;
      background: #303947;
      color: var(--ink);
      cursor: pointer;
    }

    .action:hover { background: #3a4656; }
    .action.primary { grid-column: 1 / -1; background: #1768b5; border-color: #2d82d2; }

    .shortcut-note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .game-shell { min-height: 690px; padding: 24px; }
      .panel { min-height: auto; border-left: 0; border-top: 1px solid #343d4a; }
      .board { gap: 52px 40px; }
      .participant-toggle { display: none; }
    }

    @media (max-width: 520px) {
      .game-shell { min-height: 610px; padding: 20px 16px; }
      .board { gap: 44px 22px; margin-block: 24px; }
      .instruction { font-size: .9rem; }
      .status-bar { gap: 5px 15px; font-size: .9rem; }
      .status-message { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="game-shell" id="gameShell" aria-label="Color mole test area">
      <header class="game-header">
        <div>
          <h1>COLOR MOLE</h1>
          <p class="instruction">Click the one position whose color changes.</p>
        </div>
        <button class="participant-toggle" id="hidePanel" type="button">Hide debug panel</button>
      </header>

      <div class="board" id="board" aria-label="Nine color test positions">
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
        <button class="hole" type="button" aria-label="Color test position"></button>
      </div>

      <footer class="status-bar" aria-live="polite">
        <span>Hits: <strong id="hits">0</strong></span>
        <span>Misses: <strong id="misses">0</strong></span>
        <span>Round: <strong id="round">0</strong></span>
        <span class="status-message" id="message"></span>
      </footer>
    </section>

    <aside class="panel" id="panel" aria-label="Debug controls">
      <div class="panel-heading">
        <div>
          <h2>DEBUG PANEL</h2>
          <p class="panel-note">Changes apply immediately</p>
        </div>
        <button class="close-panel" id="closePanel" type="button" aria-label="Hide debug panel">×</button>
      </div>

      <fieldset>
        <legend>Timing</legend>
        <div class="control">
          <div class="control-row"><label for="interval">Spawn interval</label><output id="intervalOut">1.20s</output></div>
          <input id="interval" type="range" min="0.2" max="5" step="0.05" value="1.2">
        </div>
        <div class="control">
          <div class="control-row"><label for="duration">Visible duration</label><output id="durationOut">0.85s</output></div>
          <input id="duration" type="range" min="0.1" max="5" step="0.05" value="0.85">
        </div>
      </fieldset>

      <div id="colorControls"></div>

      <div class="button-grid">
        <button class="action" id="pause" type="button">Pause</button>
        <button class="action" id="step" type="button">Step</button>
        <button class="action" id="reset" type="button">Reset</button>
        <button class="action primary" id="save" type="button">Save configuration</button>
      </div>
      <p class="shortcut-note">Space: pause · N: step · D: panel · Esc: clear target</p>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const DEFAULTS = {
        floor: [196, 180, 145],
        hole: [66, 210, 34],
        mole: [188, 56, 42],
        interval: 1.2,
        duration: 0.85
      };

      const $ = (selector) => document.querySelector(selector);
      const holes = [...document.querySelectorAll(".hole")];
      const app = $("#app");
      const panel = $("#panel");
      const shell = $("#gameShell");
      const message = $("#message");
      const counters = {
        hits: $("#hits"),
        misses: $("#misses"),
        round: $("#round")
      };

      let settings = loadSettings();
      let state = {
        activeIndex: null,
        previousIndex: null,
        activeSince: 0,
        nextSpawnAt: performance.now() + settings.interval * 1000,
        messageUntil: 0,
        hits: 0,
        misses: 0,
        round: 0,
        paused: false
      };

      function validColor(value, fallback) {
        if (!Array.isArray(value) || value.length !== 3) return [...fallback];
        return value.map((v, i) => Number.isFinite(+v) ? Math.max(0, Math.min(255, Math.round(+v))) : fallback[i]);
      }

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem("colorMoleDebug") || "null");
          if (!saved) return structuredClone(DEFAULTS);
          return {
            floor: validColor(saved.floor, DEFAULTS.floor),
            hole: validColor(saved.hole, DEFAULTS.hole),
            mole: validColor(saved.mole, DEFAULTS.mole),
            interval: Math.max(.2, Math.min(5, Number(saved.interval) || DEFAULTS.interval)),
            duration: Math.max(.1, Math.min(5, Number(saved.duration) || DEFAULTS.duration))
          };
        } catch {
          return structuredClone(DEFAULTS);
        }
      }

      function rgb(values) { return `rgb(${values.join(", ")})`; }

      function readableText(values) {
        const luminance = .299 * values[0] + .587 * values[1] + .114 * values[2];
        return luminance > 150 ? "#15191e" : "#f4f7fb";
      }

      function applyColors() {
        document.documentElement.style.setProperty("--floor", rgb(settings.floor));
        document.documentElement.style.setProperty("--hole", rgb(settings.hole));
        document.documentElement.style.setProperty("--mole", rgb(settings.mole));
        shell.style.color = readableText(settings.floor);
        ["floor", "hole", "mole"].forEach(name => {
          const swatch = document.querySelector(`[data-swatch="${name}"]`);
          if (swatch) swatch.style.setProperty("--swatch", rgb(settings[name]));
        });
      }

      function createColorControls() {
        const host = $("#colorControls");
        const labels = { floor: "Floor color", hole: "Hole color", mole: "Mole color" };
        const channels = ["R", "G", "B"];
        host.innerHTML = Object.keys(labels).map(name => `
          <fieldset>
            <legend>${labels[name]}</legend>
            <div class="color-group">
              <div class="color-controls">
                ${channels.map((channel, index) => `
                  <label class="channel">
                    <span>${channel}</span>
                    <input type="range" min="0" max="255" step="1" value="${settings[name][index]}" data-color="${name}" data-channel="${index}">
                    <output>${settings[name][index]}</output>
                  </label>
                `).join("")}
              </div>
              <span class="swatch" data-swatch="${name}" aria-hidden="true"></span>
            </div>
          </fieldset>
        `).join("");

        host.querySelectorAll("input[data-color]").forEach(input => {
          input.addEventListener("input", () => {
            const name = input.dataset.color;
            const channel = Number(input.dataset.channel);
            settings[name][channel] = Number(input.value);
            input.nextElementSibling.value = input.value;
            applyColors();
          });
        });
      }

      function updateCounters() {
        counters.hits.textContent = state.hits;
        counters.misses.textContent = state.misses;
        counters.round.textContent = state.round;
      }

      function setMessage(text, duration = 700) {
        message.textContent = text;
        state.messageUntil = performance.now() + duration;
      }

      function clearTarget() {
        if (state.activeIndex !== null) holes[state.activeIndex].classList.remove("active");
        state.previousIndex = state.activeIndex ?? state.previousIndex;
        state.activeIndex = null;
      }

      function spawnTarget(now = performance.now()) {
        clearTarget();
        const candidates = holes.map((_, index) => index).filter(index => index !== state.previousIndex);
        state.activeIndex = candidates[Math.floor(Math.random() * candidates.length)];
        holes[state.activeIndex].classList.add("active");
        state.activeSince = now;
        state.round += 1;
        updateCounters();
      }

      function scheduleNext(now = performance.now()) {
        clearTarget();
        state.nextSpawnAt = now + settings.interval * 1000;
      }

      function handleHoleClick(index) {
        const now = performance.now();
        if (state.activeIndex === index) {
          state.hits += 1;
          const reaction = Math.round(now - state.activeSince);
          setMessage(`Hit · ${reaction} ms`);
          scheduleNext(now);
        } else {
          state.misses += 1;
          setMessage("Miss", 500);
        }
        updateCounters();
      }

      function frame(now) {
        if (!state.paused) {
          if (state.activeIndex !== null && now - state.activeSince >= settings.duration * 1000) {
            state.misses += 1;
            updateCounters();
            setMessage("Timed out", 500);
            scheduleNext(now);
          } else if (state.activeIndex === null && now >= state.nextSpawnAt) {
            spawnTarget(now);
          }
        }
        if (message.textContent && now >= state.messageUntil) message.textContent = "";
        requestAnimationFrame(frame);
      }

      function togglePause() {
        state.paused = !state.paused;
        $("#pause").textContent = state.paused ? "Resume" : "Pause";
        setMessage(state.paused ? "Paused" : "Running", 700);
        if (!state.paused) {
          const now = performance.now();
          if (state.activeIndex === null) state.nextSpawnAt = now + settings.interval * 1000;
          else state.activeSince = now;
        }
      }

      function resetGame() {
        clearTarget();
        state.hits = 0;
        state.misses = 0;
        state.round = 0;
        state.previousIndex = null;
        state.nextSpawnAt = performance.now() + settings.interval * 1000;
        updateCounters();
        setMessage("Reset complete", 900);
      }

      function setPanelVisible(visible) {
        panel.hidden = !visible;
        app.classList.toggle("panel-hidden", !visible);
        $("#hidePanel").textContent = visible ? "Hide debug panel" : "Show debug panel";
      }

      function bindControls() {
        const interval = $("#interval");
        const duration = $("#duration");
        interval.value = settings.interval;
        duration.value = settings.duration;
        $("#intervalOut").value = `${settings.interval.toFixed(2)}s`;
        $("#durationOut").value = `${settings.duration.toFixed(2)}s`;

        interval.addEventListener("input", () => {
          settings.interval = Number(interval.value);
          $("#intervalOut").value = `${settings.interval.toFixed(2)}s`;
          if (state.activeIndex === null) state.nextSpawnAt = performance.now() + settings.interval * 1000;
        });
        duration.addEventListener("input", () => {
          settings.duration = Number(duration.value);
          $("#durationOut").value = `${settings.duration.toFixed(2)}s`;
        });

        holes.forEach((hole, index) => hole.addEventListener("click", () => handleHoleClick(index)));
        $("#pause").addEventListener("click", togglePause);
        $("#step").addEventListener("click", () => spawnTarget());
        $("#reset").addEventListener("click", resetGame);
        $("#save").addEventListener("click", () => {
          localStorage.setItem("colorMoleDebug", JSON.stringify(settings));
          setMessage("Configuration saved", 1100);
        });
        $("#hidePanel").addEventListener("click", () => setPanelVisible(panel.hidden));
        $("#closePanel").addEventListener("click", () => setPanelVisible(false));

        document.addEventListener("keydown", event => {
          if (event.code === "Space") {
            event.preventDefault();
            togglePause();
          } else if (event.key.toLowerCase() === "n") {
            spawnTarget();
          } else if (event.key.toLowerCase() === "d") {
            setPanelVisible(panel.hidden);
          } else if (event.key === "Escape") {
            scheduleNext();
          }
        });
      }

      createColorControls();
      applyColors();
      bindControls();
      updateCounters();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
